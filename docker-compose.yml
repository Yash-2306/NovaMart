services:
  backend:
    build: ./backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-120b
      - GROQ_FAST_MODEL=openai/gpt-oss-120b
      - DATABASE_URL=sqlite+aiosqlite:///./data/novamart.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-novamart-admin-2024}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - novamart-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - novamart-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:

networks:
  novamart-internal:
    driver: bridge
